<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>og-image 產生器（內部工具，不需上傳）</title>
<style>
body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#eef1ea;display:flex;flex-direction:column;align-items:center;padding:40px;gap:20px;}
canvas{max-width:100%;border:1px solid #b7c4a8;border-radius:8px;background:#fff;}
button{background:#55674a;color:#fff;border:none;padding:14px 40px;font-size:1rem;border-radius:4px;cursor:pointer;letter-spacing:.2em;}
button:hover{background:#3d4a38;}
p{color:#55674a;}
</style>
</head>
<body>
<p>下方是 1200×630 的分享圖預覽，點按鈕下載 og-image.png，再上傳到 GitHub repo 根目錄。</p>
<canvas id="c" width="1200" height="630"></canvas>
<button onclick="dl()">下載 og-image.png</button>
<script>
const ctx = document.getElementById('c').getContext('2d');
// 背景漸層
const bg = ctx.createLinearGradient(0,0,0,630);
bg.addColorStop(0,'#dfe6d8'); bg.addColorStop(1,'#eef1ea');
ctx.fillStyle = bg; ctx.fillRect(0,0,1200,630);
// 遠山
ctx.fillStyle = 'rgba(183,196,168,.55)';
ctx.beginPath(); ctx.moveTo(0,470); ctx.lineTo(180,340); ctx.lineTo(360,440); ctx.lineTo(560,300); ctx.lineTo(760,430); ctx.lineTo(980,330); ctx.lineTo(1200,420); ctx.lineTo(1200,630); ctx.lineTo(0,630); ctx.closePath(); ctx.fill();
// 中山
ctx.fillStyle = 'rgba(141,160,124,.6)';
ctx.beginPath(); ctx.moveTo(0,520); ctx.lineTo(240,420); ctx.lineTo(460,500); ctx.lineTo(700,400); ctx.lineTo(940,490); ctx.lineTo(1200,430); ctx.lineTo(1200,630); ctx.lineTo(0,630); ctx.closePath(); ctx.fill();
// 近山
ctx.fillStyle = '#55674a';
ctx.beginPath(); ctx.moveTo(0,630); ctx.lineTo(150,540); ctx.lineTo(400,600); ctx.lineTo(640,510); ctx.lineTo(900,590); ctx.lineTo(1130,530); ctx.lineTo(1200,560); ctx.lineTo(1200,630); ctx.closePath(); ctx.fill();
// 霧帶
ctx.fillStyle = 'rgba(247,246,241,.55)';
ctx.beginPath(); ctx.ellipse(380,470,300,36,0,0,Math.PI*2); ctx.fill();
ctx.beginPath(); ctx.ellipse(900,430,320,32,0,0,Math.PI*2); ctx.fill();
// 葉形 logo
function leaf(x,y,s,c1,c2){
  ctx.save(); ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle=c1;
  ctx.beginPath(); ctx.moveTo(16,4);
  ctx.bezierCurveTo(16,4,8,12,8,19);
  ctx.arc(16,19,8,Math.PI,0,true);
  ctx.bezierCurveTo(24,12,16,4,16,4); ctx.closePath(); ctx.fill();
  ctx.fillStyle=c2;
  ctx.beginPath(); ctx.moveTo(16,9);
  ctx.bezierCurveTo(16,9,11,14.5,11,19);
  ctx.arc(16,19,5,Math.PI,0,true);
  ctx.bezierCurveTo(21,14.5,16,9,16,9); ctx.closePath(); ctx.fill();
  ctx.restore();
}
leaf(120,140,3.4,'rgba(125,143,111,.55)','#55674a');
// 文字
ctx.fillStyle = '#3d4a38';
ctx.font = '700 92px "Noto Serif TC","DFKai-SB",serif';
ctx.fillText('語聲山語', 240, 215);
ctx.fillStyle = '#55674a';
ctx.font = '400 40px "Noto Sans TC","Microsoft JhengHei",sans-serif';
ctx.fillText('語言治療衛教平台', 246, 285);
ctx.fillStyle = '#6a7263';
ctx.font = '300 30px "Noto Sans TC","Microsoft JhengHei",sans-serif';
ctx.fillText('兒童語言・構音・吞嚥・嗓音・失語症・溝通輔具', 246, 345);
function dl(){
  const a = document.createElement('a');
  a.download = 'og-image.png';
  a.href = document.getElementById('c').toDataURL('image/png');
  a.click();
}
</script>
</body>
</html>
